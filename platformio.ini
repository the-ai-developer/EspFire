; EspFire — ESP32 Fire Alarm (PlatformIO)
; 38-pin DevKit V1 + QC0050 + Blynk

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    blynkkk/Blynk@^1.3.2
build_flags =
    -DBLYNK_PRINT=Serial
    -O2
